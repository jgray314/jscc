[project]
name = "jscc"
version = "0.1.0"
description = "Job Search Command Center: a job-search pipeline tracker with eval-backed LLM stages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "click>=8.1",
    "anthropic>=1.2.0",
    "requests>=2.34.2",
    "readability-lxml>=0.9",
    "playwright>=1.62.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.16.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jscc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pyflakes + pycodestyle core (unused imports, undefined names, etc).
# I: import sorting. UP: pyupgrade (modern syntax for the pinned Python
# version). B: bugbear (common correctness footguns beyond bare pyflakes).
select = ["E", "F", "I", "UP", "B"]
# E501 (line too long) is deliberately off, not deferred: this codebase's
# design-rationale comments and docstrings are long-form prose by design
# (see docs/design-principles.md and most module docstrings) -- mechanically
# wrapping them at 100 chars would be pure churn against an established
# writing style, not a real improvement. Actual code lines rarely approach
# the limit; ruff format still reformats those normally.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B008 flags `Depends(...)` in a default argument as a mutable-default-style
# footgun. In FastAPI it is the framework's own dependency-injection idiom --
# the call is never re-evaluated per request the way a real mutable default
# would be -- so the rule is a false positive here, not a deferred fix.
"jscc/web/app.py" = ["B008"]
