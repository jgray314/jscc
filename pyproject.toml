[project]
name = "jscc"
version = "0.1.0"
description = "Job Search Command Center — an agentic pipeline tracker with eval-gated LLM stages."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "click>=8.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jscc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
