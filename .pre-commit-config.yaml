repos:
  - repo: local
    hooks:
      - id: jscc-content-scan
        name: JSCC content scan (D7 M3)
        entry: bash scripts/scan_tracked.sh
        language: system
        # Scan all text-like files by default. The scanner itself skips binaries
        # via UnicodeDecodeError, so a broad filter is safe and errs toward
        # catching things.
        #
        # The exclude list lives in scripts/scan_tracked.sh, which CI also
        # invokes. See H-precommit-changelog-1 in the A10 review: previously
        # this file duplicated the exclude list and CI drifted from local,
        # causing `pre-commit run --all-files` to fail on a clean tree that
        # CI accepted.
        types_or: [text]
      - id: ruff-lint
        name: ruff lint
        entry: uv run ruff check .
        language: system
        # Whole-tree, not staged-files-only: matches CI (ci.yml runs the same
        # command), and pass_filenames: false keeps pre-commit from passing a
        # partial file list that ruff would resolve against a different set
        # of excludes than CI's full-repo run.
        pass_filenames: false
        types_or: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        types_or: [python]
