<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}JSCC{% endblock %}</title>
  <!-- CDN, not a bundled dependency: ADR-007 keeps the dashboard out of a
       JS build step entirely. -->
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 60rem; }
    .banner { background: #fef3c7; border: 1px solid #d97706; padding: 0.5rem 1rem;
               border-radius: 4px; margin-bottom: 1.5rem; font-weight: 600; }
    table { border-collapse: collapse; }
    th, td { text-align: left; padding: 0.25rem 1rem 0.25rem 0; }
    h2 { margin-top: 2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.25rem; }
    h3 { margin-top: 1rem; margin-bottom: 0.25rem; font-size: 1rem; color: #444; }
    nav { margin-bottom: 1rem; }
    nav a { margin-right: 1rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.15rem 1rem; }
    dt { font-weight: 600; color: #444; }
    dd { margin: 0; }
    .outcome-created { color: #15803d; font-weight: 600; }
    .outcome-error { color: #b91c1c; font-weight: 600; }
    textarea { width: 100%; box-sizing: border-box; font-family: inherit; }
  </style>
</head>
<body>
  <nav><a href="/">Dashboard</a> · <a href="/dlq">DLQ</a></nav>
  {% if is_synthetic %}
  <div class="banner">SYNTHETIC MODE — no real personal data in this instance</div>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
