name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Actions are SHA-pinned with the release tag in a trailing comment.
# A floating major-tag pin (@v4,
# @v6) can be silently repointed upstream — either by an accidental release
# retag or a compromised maintainer — and would execute arbitrary code with
# access to the checkout and GITHUB_TOKEN. Phase B introduces API-key secrets
# so this needs to be right before then. To update: bump the tag in the
# comment, re-resolve the SHA via `gh api repos/OWNER/REPO/git/refs/tags/vX`,
# paste the commit SHA before the `#`.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        # --frozen refuses to update the lockfile — CI must match what
        # the developer committed.
        run: uv sync --all-extras --frozen

      - name: Run ruff lint
        run: uv run ruff check .

      - name: Run ruff format check
        run: uv run ruff format --check .

      - name: Run pytest
        run: uv run pytest -q

      - name: Check the feature list
        # Stdlib only; fails on a hand-edited state, a second active feature, or
        # a passing feature whose evidence seal does not match.
        run: python3 scripts/features.py check

      - name: Replay recorded evals through the CLI
        # No API key is set on this job, so a replay cannot make a billed call.
        # Each suite exits non-zero below its pass-rate bar (or, for routing
        # and composition, on a zero-tolerance miss). The unit tests pin which
        # case ids pass; this step proves the shipped command does the replay.
        run: |
          uv run python -m jscc eval jd_extraction --replay
          uv run python -m jscc eval fit_scoring --replay
          uv run python -m jscc eval routing --replay
          uv run python -m jscc eval composition --replay
          uv run python -m jscc eval extraction_to_scoring --replay

      - name: Run precommit safety scanner on tracked files
        # scan_tracked.sh is the single source of truth for the exclude list;
        # .pre-commit-config.yaml calls the same script so CI and local hooks
        # cannot drift.
        run: bash scripts/scan_tracked.sh
