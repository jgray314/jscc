name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Run pytest
        run: uv run pytest -q

      - name: Run precommit safety scanner on tracked files
        run: |
          # Exclude files that legitimately contain placeholder personal-data
          # shapes: the scanner's own tests, its docstring, and CHANGELOG
          # entries describing it. Every other tracked file is scanned.
          git ls-files -z | xargs -0 uv run python scripts/precommit_scan.py \
            --exclude 'tests/test_precommit_scan.py' \
            --exclude 'scripts/precommit_scan.py' \
            --exclude 'CHANGELOG.md'
